[package]
name = "punk-server-mongo"
description = "A Mongo database for punkroc's server platform: the official driver as a punk-server Documents, limited to the collections the wiring allows."
version = "0.1.0"
edition = "2024"
publish = false

# A library for the wiring of an app (its main.rs and tests), on Linux and macOS: the app itself
# only sees the `Documents` capability of punk-server. See platforms/server/README.md.
[lib]
path = "src/lib.rs"

[dependencies]
ambit-lockdown = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }
mongodb = { version = "3", default-features = false, features = ["sync", "rustls-tls", "dns-resolver", "compat-3-3-0", "bson-3"] }
punk-server = { path = "../host" }
tracing = "0.1"
