[package]
name = "punk-cli-hermit"
description = "Spike: punkroc's cli platform as a Hermit unikernel. Links a compiled punk app object into a Hermit image."
version = "0.1.0"
edition = "2024"
publish = false

# Built only for x86_64-unknown-hermit (see README.md): the app object comes in
# through PUNK_APP_OBJECTS, read by build.rs.
[[bin]]
name = "punk-cli-hermit"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
punk-roc-abi = { path = "../../roc-abi" }

# The kernel, built from source by the hermit crate. Same tag as ambit.
# Deployment profile: qemu (ACPI, PCI). No network, no file system.
[target.'cfg(target_os = "hermit")'.dependencies]
hermit = { git = "https://github.com/hermit-os/hermit-rs.git", tag = "hermit-0.13.2", default-features = false, features = ["acpi", "pci"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
